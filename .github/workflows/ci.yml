name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: kohwai, POSTGRES_PASSWORD: secret, POSTGRES_DB: kohwai_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kohwai" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: pip install -r requirements.txt
      - name: Dependency sanity (catches kombu/redis style conflicts)
        run: pip check
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run lint --workspace=apps/web
      - run: npm run build --workspace=apps/web

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
        working-directory: apps/mobile
