[pytest]
asyncio_mode = auto
testpaths = tests

# Tests use isolated databases and Redis databases.
env =
    ENVIRONMENT=development
    EXPOSE_DEV_OTP=true
    DATABASE_URL=postgresql://kohwai:secret@localhost:5434/kohwai_run_test
    REDIS_URL=redis://localhost:6382/15
    CELERY_BROKER_URL=redis://localhost:6382/15
    CELERY_RESULT_BACKEND=redis://localhost:6382/10
    SECRET_KEY=test-secret-key-for-local-testing-only
    AT_API_KEY=
    AT_USERNAME=
    SENTRY_DSN=