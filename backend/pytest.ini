[pytest]
asyncio_mode = auto
testpaths = tests

# Safe defaults for local testing.
# D: means use these values only when the environment has not
# already supplied a value (for example, GitHub Actions).
env =
    D:ENVIRONMENT=development
    D:EXPOSE_DEV_OTP=true
    D:DATABASE_URL=postgresql://kohwai:secret@localhost:5434/kohwai_run_test
    D:REDIS_URL=redis://localhost:6382/15
    D:CELERY_BROKER_URL=redis://localhost:6382/15
    D:CELERY_RESULT_BACKEND=redis://localhost:6382/10
    D:SECRET_KEY=test-secret-key-for-local-testing-only
    D:AT_API_KEY=
    D:AT_USERNAME=
    D:SENTRY_DSN=