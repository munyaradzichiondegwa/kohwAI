[pytest]
asyncio_mode = auto
testpaths = tests
# Requires pytest-env (in requirements.txt). Tests run against a SEPARATE database
# (kohwai_test) and never against your dev data. Create it once:
#   createdb -h localhost -U kohwai kohwai_test    (host port is 5434 if using docker compose)
env =
    ENVIRONMENT=development
    EXPOSE_DEV_OTP=true
    DATABASE_URL=postgresql://kohwai:secret@localhost:5432/kohwai_test
    REDIS_URL=redis://localhost:6379/15
    CELERY_BROKER_URL=redis://localhost:6379/15
    CELERY_RESULT_BACKEND=redis://localhost:6379/15
    SECRET_KEY=test-secret-key
    AT_API_KEY=
    AT_USERNAME=
    SENTRY_DSN=
