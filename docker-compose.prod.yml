# KohwAI — production stack (single VPS, Docker Compose v2).
#
#   cp .env.prod.example .env.prod        # edit DOMAIN, ACME_EMAIL, helplines, USSD IPs...
#   ./scripts/gen-secrets.sh               # creates ./secrets/* (never committed)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# See docs/DEPLOYMENT.md for the full runbook (DNS, firewall, first deploy, updates, backups, restore drill).
#
# Design rules (enforced by backend/tests/test_batch3_prod_compose.py):
#   * ONLY the reverse proxy publishes ports. PostgreSQL, Redis and the API are never reachable from outside.
#   * Secrets are files (/run/secrets/*), never environment variables or committed values.
#   * App containers are non-root, read-only, cap-dropped. No source mounts, no --reload, no Flower.
#   * Every image is pinned; the database is migrated by a one-shot job before the app starts.
name: kohwai

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  ENVIRONMENT: production
  POSTGRES_HOST: db
  REDIS_HOST: redis
  ALLOWED_ORIGINS: '["https://${DOMAIN:?set DOMAIN in .env.prod}"]'
  AT_USERNAME: ${AT_USERNAME:-}
  AT_SHORTCODE: ${AT_SHORTCODE:-}
  USSD_ALLOWED_IPS: ${USSD_ALLOWED_IPS:-}
  USSD_SERVICE_CODE: ${USSD_SERVICE_CODE:-}
  VET_SERVICES_CONTACT: ${VET_SERVICES_CONTACT:-}
  AGRITEX_CONTACT: ${AGRITEX_CONTACT:-}
  TERMS_VERSION: ${TERMS_VERSION:-2026-11-draft}
  SENTRY_DSN: ${SENTRY_DSN:-}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}

x-app: &app
  image: kohwai/api:${KOHWAI_VERSION:-local}
  build: { context: ./backend }
  restart: unless-stopped
  environment: *app-env
  secrets: [SECRET_KEY, POSTGRES_PASSWORD, REDIS_PASSWORD, AT_API_KEY]
  networks: [data, edge]               # data = database/cache (no internet); edge = outbound internet (NASA POWER, SMS gateway)
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  logging: *logging

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kohwai
      POSTGRES_USER: kohwai
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=1000"]
    secrets: [POSTGRES_PASSWORD]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kohwai -d kohwai"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # maxmemory-policy noeviction: Celery's queue lives here — evicting a queued task would silently lose an alert.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/REDIS_PASSWORD)\" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction"]
    secrets: [REDIS_PASSWORD]
    volumes: [redis_data:/data]
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/REDIS_PASSWORD)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    networks: [data]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    mem_limit: 768m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=2",
              "-Q", "default,satellite,alerts,insurance,risk_model", "--max-tasks-per-child=200"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -t 5 -d celery@$$HOSTNAME | grep -q pong"]
      interval: 60s
      timeout: 15s
      start_period: 40s
      retries: 3
    mem_limit: 768m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:                                  # exactly ONE instance: two schedulers would double-fire every job
    <<: *app
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: kohwai/web:${KOHWAI_VERSION:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""          # same origin: the proxy routes /api to the API
        NEXT_PUBLIC_TERMS_URL: ${TERMS_URL:-}
        NEXT_PUBLIC_PRIVACY_URL: ${PRIVACY_URL:-}
        NEXT_PUBLIC_VET_CONTACT: ${VET_SERVICES_CONTACT:-}
        NEXT_PUBLIC_AGRITEX_CONTACT: ${AGRITEX_CONTACT:-}
        NEXT_PUBLIC_TILE_URL: ${TILE_URL:-}
    restart: unless-stopped
    networks: [edge]
    read_only: true
    tmpfs: [/tmp, "/app/apps/web/.next/cache"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    ports:                               # the ONLY published ports in this file
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                 # certificates: losing this volume means re-issuing them (rate limits!)
      - caddy_config:/config
    networks: [edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on: [api, web]
    logging: *logging

  backup:
    image: kohwai/backup:${KOHWAI_VERSION:-local}
    build: { context: ./infrastructure/backup }
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: kohwai
      PGDATABASE: kohwai
      BACKUP_DIR: /backups
      BACKUP_CRON: ${BACKUP_CRON:-30 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
    secrets: [POSTGRES_PASSWORD, BACKUP_AGE_RECIPIENT]     # PUBLIC key only: the server cannot decrypt its own backups
    volumes: [backups:/backups]
    networks: [data, edge]               # edge only so BACKUP_UPLOAD_CMD can reach off-site storage
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # fails if no successful backup in the last 26 hours
      test: ["CMD-SHELL", "find /backups/.last_success -mmin -1560 | grep -q ."]
      interval: 1h
      timeout: 10s
      start_period: 10m
      retries: 1
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  # ── optional: `docker compose --profile monitoring up -d` — reachable only via an SSH tunnel to the host ──
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GRAFANA_PASSWORD
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets: [GRAFANA_PASSWORD]
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

networks:
  data:
    internal: true                       # no route to the internet
  edge: {}

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backups:
  prometheus_data:
  grafana_data:

secrets:
  SECRET_KEY:           { file: ./secrets/SECRET_KEY }
  POSTGRES_PASSWORD:    { file: ./secrets/POSTGRES_PASSWORD }
  REDIS_PASSWORD:       { file: ./secrets/REDIS_PASSWORD }
  AT_API_KEY:           { file: ./secrets/AT_API_KEY }
  GRAFANA_PASSWORD:     { file: ./secrets/GRAFANA_PASSWORD }
  BACKUP_AGE_RECIPIENT: { file: ./secrets/BACKUP_AGE_RECIPIENT }
