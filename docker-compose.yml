services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: kohwai
      POSTGRES_USER: kohwai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kohwai"]
      interval: 10s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kohwai_ts
      POSTGRES_USER: kohwai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kohwai:${POSTGRES_PASSWORD:-secret}@db:5432/kohwai
      TIMESCALE_URL: postgresql://kohwai:${POSTGRES_PASSWORD:-secret}@timescaledb:5432/kohwai_ts
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kohwai:${POSTGRES_PASSWORD:-secret}@db:5432/kohwai
      TIMESCALE_URL: postgresql://kohwai:${POSTGRES_PASSWORD:-secret}@timescaledb:5432/kohwai_ts
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.core.celery_app worker --loglevel=info -Q default,satellite,alerts,insurance,risk_model
    depends_on:
      - api
    volumes:
      - ./backend:/app

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kohwai:${POSTGRES_PASSWORD:-secret}@db:5432/kohwai
      TIMESCALE_URL: postgresql://kohwai:${POSTGRES_PASSWORD:-secret}@timescaledb:5432/kohwai_ts
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    depends_on:
      - celery_worker
    volumes:
      - ./backend:/app

  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - celery_worker

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    restart: unless-stopped
    ports:
      - "5050:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://kohwai:${POSTGRES_PASSWORD:-secret}@db:5432/kohwai
    command: >
      sh -c "pip install psycopg2-binary && mlflow server
      --host 0.0.0.0
      --backend-store-uri postgresql+psycopg2://kohwai:${POSTGRES_PASSWORD:-secret}@db:5432/kohwai
      --default-artifact-root s3://${S3_MODEL_BUCKET:-kohwai-models}/mlflow"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3012:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  prometheus_data:
  grafana_data: